# Nginx configuration for Onyx + Frontdesk CRM
# Serves both Onyx and the CRM on agent.opentruthai.com

upstream onyx_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream frontdesk_upstream {
    server 127.0.0.1:8001;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name agent.opentruthai.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agent.opentruthai.com;

    ssl_certificate /etc/letsencrypt/live/agent.opentruthai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.opentruthai.com/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Basic auth for entire site
    auth_basic "Restricted Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Increased timeouts for AI processing
    client_max_body_size 100M;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;
    proxy_send_timeout 300s;

    # J. Austin Front Desk CRM
    location /frontdesk/static/ {
        alias /opt/frontdesk/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /frontdesk/ {
        proxy_pass http://frontdesk_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /frontdesk;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    # Onyx (default - everything else)
    location / {
        proxy_pass http://onyx_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}
