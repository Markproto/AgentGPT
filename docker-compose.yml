version: '3.8'

services:
  agentgpt:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: agentgpt
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env.production
    volumes:
      - ./db:/app/db
      - ./.next:/app/.next
    networks:
      - webnet
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: PostgreSQL database for production
  # Uncomment if you want to use PostgreSQL instead of SQLite
  # db:
  #   image: postgres:15-alpine
  #   container_name: agentgpt-db
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: agentgpt
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
  #     POSTGRES_DB: agentgpt
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - webnet
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U agentgpt"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

networks:
  webnet:
    external: true
    name: webnet

