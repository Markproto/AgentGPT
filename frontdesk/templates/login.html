<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - J. Austin Front Desk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #1a1a2e; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { max-width: 400px; width: 100%; border: none; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .login-header { background: linear-gradient(135deg, #ffc107, #ff9800); border-radius: 16px 16px 0 0; padding: 2rem; text-align: center; }
        .login-header h3 { color: #1a1a2e; font-weight: 700; margin: 0; }
        .login-header p { color: rgba(0,0,0,0.6); margin: 0.5rem 0 0; }
    </style>
</head>
<body>
    <div class="card login-card">
        <div class="login-header">
            <h3>J. Austin</h3>
            <p>Front Desk Processing</p>
        </div>
        <div class="card-body p-4">
            {% if form.errors %}
            <div class="alert alert-danger">Invalid username or password.</div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_username" class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" id="id_username" autofocus required>
                </div>
                <div class="mb-3">
                    <label for="id_password" class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" id="id_password" required>
                </div>
                <button type="submit" class="btn btn-warning w-100 fw-bold">Sign In</button>
            </form>
        </div>
    </div>
</body>
</html>
